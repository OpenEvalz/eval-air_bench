[project]
name = "openevalz-eval-air-bench"
version = "0.1.0"
description = "OpenEvalz packaging of AIR Bench: AI Risk Benchmark"
license = { text = "BUSL-1.1" }
requires-python = ">=3.10"
dependencies = [
  "inspect-ai==0.3.260",
  "trusted-router>=0.7.0",
  "pyyaml>=6",
]

[tool.openevalz]
eval = "air_bench"
execution_class = "plain"
cost_class = "medium"
